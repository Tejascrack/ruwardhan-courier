<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruwardhan Courier Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <!-- Top Navbar -->
  <header class="navbar-custom">
    <div class="container d-flex justify-content-between align-items-center">
      <div class="brand-title">
        📦 Ruwardhan Courier
      </div>
      <div>
        <a href="/" class="btn btn-sm btn-outline-custom">Back to Tracker</a>
      </div>
    </div>
  </header>

  <main class="container py-4" style="max-width: 620px;">
    <div class="custom-card">
      <h3 class="fw-bold mb-1">New Consignment Booking</h3>
      <p class="text-muted mb-4 small">Fill the sender and recipient details to register a parcel.</p>

      {% if new_id %}
        <div class="alert alert-success text-center mb-4 rounded-3 p-3">
          <div class="fw-bold fs-6">Booking Successful!</div>
          <div class="my-2 text-muted small">Share this tracking ID with the customer:</div>
          <div class="badge bg-dark fs-4 px-3 py-2 letter-spacing-1">{{ new_id }}</div>
        </div>
      {% endif %}

      <form action="/book" method="POST">
        <div class="mb-3">
          <label class="form-label">Sender's Full Name</label>
          <input type="text" name="sender_name" class="form-control" placeholder="e.g. Ramesh Patil" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Receiver's Full Name</label>
          <input type="text" name="receiver_name" class="form-control" placeholder="e.g. Priya Sharma" required>
        </div>

        <div class="mb-4">
          <label class="form-label">Delivery Address & Pincode</label>
          <textarea name="receiver_address" class="form-control" rows="3" placeholder="Flat No., Street, City, State, PIN" required></textarea>
        </div>

        <button type="submit" class="btn btn-primary-custom w-100 py-3">Register Shipment</button>
      </form>
    </div>
  </main>

  <footer>
    <p>© 2026 Ruwardhan Courier Management System</p>
  </footer>

</body>
</html>
